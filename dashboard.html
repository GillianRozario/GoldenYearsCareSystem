<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="header">Golden Years Care System</div>

<div class="container">
  <h2>Dashboard</h2>
  <p id="roleText"></p>

  <div class="dashboard-actions">
    <button id="addBtn">Add New Admission</button>
    <button onclick="location.href='search.html'">Search Admission</button>
  </div>
</div>

<script>
  const role = localStorage.getItem("role");

  if (!role) location.href = "index.html";

  roleText.innerText = "Logged in as: " + role;

  if (role === "Owner") {
    addBtn.style.display = "none";
  } else {
    addBtn.onclick = () => location.href = "admission.html";
  }
</script>

</body>
</html>
